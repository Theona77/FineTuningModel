# Fine-tuning config. Paths are relative to the repo root.
# Override any value on the command line: python training/train.py --set train.epochs=5

run_name: finetune              # outputs go to runs/<run_name>/

data:
  sources:                      # audio + .lab pairs, matched by song id; add public datasets here
    - {audio: data/songs, labels: labels}
  cache_dir: cache/features
  splits_file: training/splits.json   # created on first run; commit it so splits stay fixed
  val_fraction: 0.15
  test_fraction: 0.15
  split_seed: 42
  test_only:                    # never trained on; scored as a separate 'holdout' split
    - thats_who_i_praise        # chart arrangement doesn't match the recording
    - holy_spirit               # chart covers only part of the song
    - what_a_beautiful_name     # chart fits the audio poorly in every key
    - run_to_the_father         # chart is the Women Who Worship arrangement, audio is Cody Carnes
    - praise                    # live recording has sections the chart lacks

model:
  init: btc_large               # btc_large | btc_majmin | none | path/to/checkpoint.pt
  head_dropout: 0.1
  input_dropout: 0.2
  layer_dropout: 0.2
  attention_dropout: 0.2
  relu_dropout: 0.2

train:
  epochs: 60
  batch_size: 32
  windows_per_epoch: null       # null = 4x the training audio, in 10 s windows
  lr: 3.0e-4                    # heads
  backbone_lr_scale: 0.1        # backbone lr = lr * this
  weight_decay: 1.0e-4
  warmup_epochs: 2
  freeze_backbone_epochs: 3     # train only the new heads first
  grad_clip: 1.0
  patience: 12                  # early stopping on select_metric
  select_metric: tetrads_inv    # root majmin majmin_inv sevenths sevenths_inv tetrads tetrads_inv mirex exact
  num_workers: 0
  seed: 0
  device: auto                  # auto | cuda | mps | cpu

augment:
  max_shift: 5                  # pitch shift in semitones, uniform in [-5, 5]
  gain_db: 6.0                  # random gain in [-6, 6] dB

loss:
  head_weights: {root: 1.0, triad: 1.0, seventh: 1.0, ext: 1.0, bass: 1.0}
  class_weighting: inverse_sqrt # none | inverse_sqrt (counters maj/min dominance)
  focal_gamma: 0.0              # > 0 enables focal loss

predict:
  ext_threshold: 0.5
  min_duration: 0.0             # seconds; segments shorter than this are merged
